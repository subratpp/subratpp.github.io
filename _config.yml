# Blog: _blog/YEAR/name.md with `date:` in front matter
collections:
  blog:
    output: true
    permalink: /posts/:year/:month/:name/

# Build
include: [_pages]
exclude: [README.md, LICENSE, Gemfile, Gemfile.lock, pixi.toml, pixi.lock, .pixi, scripts, vendor]
markdown: kramdown
highlighter: rouge
timezone: Asia/Singapore

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  math_engine: mathjax

defaults:
  - scope: { path: "", type: blog }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
